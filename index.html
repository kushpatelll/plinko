<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <h1>Plinko Game</h1>
        <div id="info">
            <p>Balance: $<span id="balance">1000</span></p>
            <label for="betAmount">Place Your Bet: </label>
            <input type="number" id="betAmount" value="50" min="1" max="1000">
            <button id="startButton">Start Game</button>
        </div>
        <canvas id="plinkoBoard"></canvas>
        <div id="result"></div>
    </div>

    <script src="plinko.js"></script>
</body>
</html>
